name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio
            (un juego de Tetris en JavaScript vanilla / HTML5 Canvas, ver CLAUDE.md
            para la arquitectura: game.js, index.html, style.css).

            Tareas:
            1. Asigna los labels que correspondan usando ÚNICAMENTE labels ya
               existentes en el repo (bug, documentation, duplicate, enhancement,
               good first issue, help wanted, invalid, question, wontfix). No crees
               labels nuevos. Usa `gh issue edit ${{ github.event.issue.number }}
               --add-label "..."` (y `--remove-label` si al editar el issue algún
               label ya no aplica).
            2. Publica un comentario en el issue (`gh issue comment
               ${{ github.event.issue.number }}`) con un diagnóstico técnico breve,
               redactado en formato Markdown válido para GitHub (encabezados,
               listas, bloques de código con \`\`\` cuando cites código, etc.):
               - Causa probable del problema o resumen de la petición.
               - Archivos/funciones de game.js (u otros) probablemente involucrados.
               - Enfoque de solución sugerido, a alto nivel, para usarse después
                 como base de implementación.
               No implementes la solución, solo diagnostica.
          claude_args: '--allowed-tools "Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh label list:*)"'
